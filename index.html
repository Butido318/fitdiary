<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飲食與身形紀錄</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#1a1a1a;
    --paper:#fafaf7;
    --card:#ffffff;
    --line:#1a1a1a;
    --muted:#6b6b63;
    --flame:#e8590c;
    --leaf:#2f6f4e;
    --ochre:#c98a1d;
    --slate:#3d5a80;
    --soft-line:#e4e2da;
    --track:#eae8e0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding-bottom:140px;
  }
  .wrap{max-width:480px;margin:0 auto;padding:20px 16px 40px;}
  header{margin-bottom:14px;}
  .eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px;}
  h1{font-family:'Arial Narrow',"Helvetica Neue Condensed","Segoe UI",sans-serif;font-weight:800;font-size:30px;letter-spacing:.01em;margin:0;}
  .date{color:var(--muted);font-size:13px;margin-top:2px;}

  /* Tabs */
  .tabbar{display:flex;gap:6px;margin-bottom:18px;border-bottom:2px solid var(--line);}
  .tab-btn{
    flex:1;padding:10px 4px;background:none;border:none;cursor:pointer;
    font-weight:700;font-size:13px;color:var(--muted);
    border-bottom:3px solid transparent;margin-bottom:-2px;
  }
  .tab-btn.active{color:var(--ink);border-bottom-color:var(--flame);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .known-field{background:var(--card);border:1px solid var(--soft-line);border-radius:8px;padding:8px 10px;margin-bottom:10px;}
  .known-field label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:700;}
  .known-field textarea{border:none;background:transparent;width:100%;font-family:inherit;font-size:13px;color:var(--ink);resize:vertical;}
  .exercise-form{background:var(--card);border:1px solid var(--soft-line);border-radius:10px;padding:14px;}
  .ex-grid{margin-top:0;}
  .exercise-item{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--soft-line);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
  .exercise-item .ei-name{font-weight:700;font-size:14px;}
  .exercise-item .ei-sub{font-size:11px;color:var(--muted);margin-top:2px;}
  .exercise-item .ei-cal{font-family:'Arial Narrow',"Helvetica Neue Condensed",sans-serif;font-weight:800;font-size:18px;color:var(--slate);white-space:nowrap;}

  .item-card{background:var(--card);border:2px solid var(--line);border-radius:6px;padding:10px 12px;margin-top:12px;}
  .item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .item-head input{border:none;background:transparent;font-weight:700;font-size:14px;flex:1;font-family:inherit;color:var(--ink);}
  .src-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700;white-space:nowrap;margin-left:6px;}
  .src-badge.known{background:#e3f0e8;color:var(--leaf);}
  .src-badge.estimated{background:#fbeed9;color:var(--ochre);}
  .item-amount{font-size:11px;color:var(--muted);margin-bottom:6px;}
  .item-amount input{border:none;background:transparent;font-size:11px;color:var(--muted);width:100%;font-family:inherit;}
  .item-macros{display:flex;gap:10px;}
  .item-macros .im{flex:1;text-align:center;}
  .item-macros .im-label{font-size:10px;color:var(--muted);}
  .item-macros .im input{width:100%;text-align:center;border:1px solid var(--soft-line);border-radius:5px;font-family:'Arial Narrow',"Helvetica Neue Condensed",sans-serif;font-weight:800;font-size:14px;padding:3px 0;}
  .item-macros .im.cal input{color:var(--flame);}
  .items-total{display:flex;justify-content:space-between;padding:10px 4px;font-weight:800;font-family:'Arial Narrow',"Helvetica Neue Condensed",sans-serif;font-size:14px;border-top:2px solid var(--line);margin-top:10px;}

  .upload-box{
    border:2px dashed var(--line);border-radius:10px;padding:22px 16px;text-align:center;
    background:var(--card);cursor:pointer;position:relative;overflow:hidden;
  }
  .upload-box:active{background:#f0efe9;}
  .upload-box .icon{font-size:26px;margin-bottom:6px;}
  .upload-box .main-txt{font-weight:700;font-size:15px;}
  .upload-box .sub-txt{color:var(--muted);font-size:12px;margin-top:4px;}
  input[type=file]{display:none;}

  .preview-wrap{position:relative;margin-top:14px;}
  .preview-img{width:100%;max-height:280px;object-fit:cover;border-radius:10px;border:1px solid var(--soft-line);display:block;}
  .pose-guide{position:absolute;inset:0;pointer-events:none;opacity:.55;}

  .loading{display:flex;align-items:center;gap:10px;margin-top:16px;padding:14px;background:var(--card);border-radius:10px;border:1px solid var(--soft-line);font-size:13px;color:var(--muted);}
  .spinner{width:16px;height:16px;border:2px solid var(--soft-line);border-top-color:var(--flame);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .error-box{margin-top:14px;padding:12px 14px;background:#fdecec;border:1px solid #e0a3a3;border-radius:8px;color:#a02929;font-size:13px;}

  /* favorites */
  .fav-row{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;}
  .fav-chip{
    flex:0 0 auto;background:var(--card);border:1px solid var(--soft-line);border-radius:20px;
    padding:7px 14px;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;
  }
  .fav-chip:active{background:#f0efe9;}
  .fav-label{font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;}

  /* Nutrition Facts label card */
  .label-card{background:var(--card);border:3px solid var(--line);border-radius:4px;padding:14px 16px;margin-top:16px;}
  .label-title{font-family:'Arial Narrow',"Helvetica Neue Condensed",sans-serif;font-weight:900;font-size:22px;border-bottom:8px solid var(--line);padding-bottom:6px;margin-bottom:6px;}
  .label-name{font-weight:700;font-size:15px;padding:6px 0;border-bottom:1px solid var(--soft-line);}
  .label-name input{border:none;background:transparent;font-weight:700;font-size:15px;width:100%;font-family:inherit;color:var(--ink);}
  .portion{font-size:12px;color:var(--muted);padding:4px 0 8px;border-bottom:1px solid var(--soft-line);}
  .portion input{border:none;background:transparent;font-size:12px;color:var(--muted);width:100%;font-family:inherit;}
  .tag-row{padding:8px 0;border-bottom:6px solid var(--line);}
  .tag-row select{border:1px solid var(--soft-line);border-radius:6px;font-size:12px;padding:5px 8px;background:var(--paper);font-family:inherit;color:var(--ink);}

  .row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--soft-line);}
  .row:last-child{border-bottom:none;}
  .row .label{font-weight:600;font-size:13px;}
  .row .val{display:flex;align-items:baseline;gap:4px;font-family:'Arial Narrow',"Helvetica Neue Condensed",sans-serif;}
  .row .val input{border:none;background:transparent;text-align:right;font-weight:800;font-size:18px;width:56px;font-family:inherit;}
  .row .unit{font-size:12px;color:var(--muted);}
  .row.calories .val input{font-size:26px;color:var(--flame);}
  .row.protein .dot{color:var(--leaf);}
  .row.carbs .dot{color:var(--ochre);}
  .row.fat .dot{color:var(--slate);}
  .dot{font-size:16px;margin-right:4px;}

  .note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5;}
  .add-btn{width:100%;margin-top:12px;padding:12px;border:none;border-radius:8px;background:var(--ink);color:var(--paper);font-weight:700;font-size:14px;cursor:pointer;}
  .add-btn:active{opacity:.8;}
  .cancel-btn{width:100%;margin-top:8px;padding:10px;border:1px solid var(--soft-line);border-radius:8px;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;}
  .fav-check{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:10px;}

  .section-title{font-family:'Arial Narrow',"Helvetica Neue Condensed",sans-serif;font-weight:800;font-size:18px;margin:26px 0 10px;}
  .empty{color:var(--muted);font-size:13px;padding:16px 0;text-align:center;}

  .log-item{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--soft-line);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
  .log-item .li-name{font-weight:700;font-size:14px;}
  .log-item .li-macros{font-size:11px;color:var(--muted);margin-top:2px;}
  .log-item .li-tag{display:inline-block;font-size:10px;background:var(--track);border-radius:10px;padding:1px 8px;margin-left:6px;color:var(--muted);}
  .log-item .li-cal{font-family:'Arial Narrow',"Helvetica Neue Condensed",sans-serif;font-weight:800;font-size:18px;color:var(--flame);white-space:nowrap;}
  .li-left{flex:1;min-width:0;}
  .del-btn{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 0 0 10px;line-height:1;}

  .summary-bar{position:fixed;bottom:0;left:0;right:0;background:var(--ink);color:var(--paper);padding:10px 16px calc(10px + env(safe-area-inset-bottom));}
  .summary-inner{max-width:480px;margin:0 auto;}
  .sum-row{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;}
  .sum-row:last-child{margin-bottom:0;}
  .sum-item{flex:1;}
  .sum-item .sum-top{display:flex;justify-content:space-between;font-size:10px;opacity:.75;margin-bottom:3px;}
  .sum-item .sum-cur{font-family:'Arial Narrow',"Helvetica Neue Condensed",sans-serif;font-weight:800;}
  .bar-track{height:5px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:3px;}
  .bar-fill.cal{background:var(--flame);}
  .bar-fill.protein{background:#5ea67e;}
  .bar-fill.carbs{background:#e0b256;}
  .bar-fill.fat{background:#7a9bc4;}

  /* Body tab */
  .angle-select{display:flex;gap:8px;margin:12px 0;}
  .angle-btn{flex:1;padding:8px;border:1px solid var(--soft-line);border-radius:8px;background:var(--card);font-size:12px;font-weight:600;cursor:pointer;}
  .angle-btn.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .field-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;}
  .field{background:var(--card);border:1px solid var(--soft-line);border-radius:8px;padding:8px 10px;}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:2px;}
  .field input,.field select{border:none;background:transparent;width:100%;font-family:inherit;font-size:15px;font-weight:700;color:var(--ink);}
  .note-field{margin-top:10px;background:var(--card);border:1px solid var(--soft-line);border-radius:8px;padding:8px 10px;}
  .note-field label{display:block;font-size:11px;color:var(--muted);margin-bottom:2px;}
  .note-field input{border:none;background:transparent;width:100%;font-family:inherit;font-size:13px;color:var(--ink);}

  .body-timeline{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;}
  .body-thumb{flex:0 0 auto;width:90px;text-align:center;}
  .body-thumb img{width:90px;height:120px;object-fit:cover;border-radius:8px;border:1px solid var(--soft-line);}
  .body-thumb .bt-date{font-size:10px;color:var(--muted);margin-top:4px;}
  .body-thumb .bt-weight{font-size:12px;font-weight:800;}
  .body-thumb .bt-muscle{font-size:10px;font-weight:700;color:var(--leaf);}
  .chart-legend{display:flex;gap:14px;font-size:11px;margin-bottom:6px;}
  .chart-legend span{display:flex;align-items:center;gap:4px;}
  .chart-legend .dotline{width:10px;height:2px;display:inline-block;}

  .chart-box{background:var(--card);border:1px solid var(--soft-line);border-radius:10px;padding:14px;margin-top:10px;}

  .compare-box{background:var(--card);border:1px solid var(--soft-line);border-radius:10px;padding:14px;margin-top:10px;}
  .compare-selects{display:flex;gap:10px;}
  .compare-selects select{flex:1;padding:8px;border:1px solid var(--soft-line);border-radius:8px;font-size:12px;background:var(--paper);font-family:inherit;}
  .compare-view{display:flex;gap:10px;margin-top:14px;}
  .compare-col{flex:1;text-align:center;}
  .compare-col img{width:100%;height:220px;object-fit:cover;border-radius:8px;border:1px solid var(--soft-line);}
  .compare-col .cc-date{font-size:12px;font-weight:700;margin-top:6px;}
  .compare-col .cc-weight{font-size:11px;color:var(--muted);}
  .diff-badge{text-align:center;margin-top:10px;font-size:13px;font-weight:700;}
  .diff-badge.down{color:var(--leaf);}
  .diff-badge.up{color:var(--flame);}

  /* Settings tab */
  .settings-card{background:var(--card);border:1px solid var(--soft-line);border-radius:10px;padding:16px;}
  .settings-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--soft-line);}
  .settings-row:last-child{border-bottom:none;}
  .settings-row label{font-size:13px;font-weight:600;}
  .settings-row input{width:80px;text-align:right;border:1px solid var(--soft-line);border-radius:6px;padding:6px 8px;font-family:inherit;font-size:14px;}
  .save-btn{width:100%;margin-top:14px;padding:12px;border:none;border-radius:8px;background:var(--ink);color:var(--paper);font-weight:700;font-size:14px;cursor:pointer;}
  .export-btn{width:100%;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;}
  .saved-toast{text-align:center;font-size:12px;color:var(--leaf);margin-top:8px;height:14px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">飲食與身形紀錄</div>
    <h1 id="pageTitle">今天吃了什麼？</h1>
    <div class="date" id="dateLabel"></div>
  </header>

  <div class="tabbar">
    <button class="tab-btn active" data-tab="diet">飲食</button>
    <button class="tab-btn" data-tab="body">身形</button>
    <button class="tab-btn" data-tab="settings">目標／匯出</button>
  </div>

  <!-- DIET TAB -->
  <div class="tab-panel active" id="tab-diet">
    <div id="favArea"></div>

    <div class="known-field">
      <label for="knownItemsInput">已知品項與克數（選填）</label>
      <textarea id="knownItemsInput" rows="2" placeholder="例如：雞胸肉 150g、白飯 200g&#10;沒寫出來的部分交給 AI 從照片判斷"></textarea>
    </div>

    <label class="upload-box" id="uploadBox">
      <div class="icon">📷</div>
      <div class="main-txt">拍照或上傳食物照片</div>
      <div class="sub-txt">AI 會結合上方已知品項，估算剩下的部分</div>
      <input type="file" id="fileInput" accept="image/*" capture="environment">
    </label>

    <img id="previewImg" class="preview-img" style="display:none;margin-top:14px;">
    <div id="loadingBox" class="loading" style="display:none;">
      <div class="spinner"></div><span>正在辨識食物、估算營養中…</span>
    </div>
    <div id="errorBox" class="error-box" style="display:none;"></div>
    <div id="resultCard"></div>

    <div class="section-title">今日紀錄</div>
    <div id="logList"></div>

    <div class="section-title">運動紀錄</div>
    <div class="exercise-form">
      <div class="field-grid ex-grid">
        <div class="field">
          <label>運動類型</label>
          <select id="ex-type">
            <option value="橢圓機" data-met="5.0">橢圓機</option>
            <option value="拳擊" data-met="7.8">拳擊</option>
            <option value="BODY COMBAT" data-met="8.5">BODY COMBAT</option>
            <option value="BODY PUMP" data-met="6.0">BODY PUMP</option>
            <option value="重訓（臀腿）" data-met="6.0">重訓（臀腿）</option>
            <option value="重訓（肩背手）" data-met="5.0">重訓（肩背手）</option>
          </select>
        </div>
        <div class="field"><label>時間 (分鐘)</label><input type="number" id="ex-duration" placeholder="30"></div>
        <div class="field"><label>體重 (kg)</label><input type="number" id="ex-weight" step="0.1" placeholder="從身形紀錄帶入"></div>
      </div>
      <button class="add-btn" onclick="addExercise()">計算並加入運動紀錄</button>
      <div class="note">＊ 以 MET 公式估算：消耗大卡 = MET × 體重(kg) × 時間(小時)，實際消耗因人而異，僅供參考。</div>
    </div>
    <div id="exerciseList" style="margin-top:10px;"></div>
  </div>

  <!-- BODY TAB -->
  <div class="tab-panel" id="tab-body">
    <label class="upload-box" id="bodyUploadBox">
      <div class="icon">🧍</div>
      <div class="main-txt">拍攝身形照片</div>
      <div class="sub-txt">建議固定站位／距離，比較才準確</div>
      <input type="file" id="bodyFileInput" accept="image/*" capture="environment">
    </label>

    <div class="angle-select">
      <button class="angle-btn active" data-angle="正面">正面</button>
      <button class="angle-btn" data-angle="側面">側面</button>
      <button class="angle-btn" data-angle="背面">背面</button>
    </div>

    <div id="bodyPreviewWrap" style="display:none;">
      <div class="preview-wrap">
        <img id="bodyPreviewImg" class="preview-img">
        <svg class="pose-guide" viewBox="0 0 100 140" preserveAspectRatio="none">
          <line x1="50" y1="0" x2="50" y2="140" stroke="#ffffff" stroke-width="0.4" stroke-dasharray="2,2"/>
          <ellipse cx="50" cy="14" rx="7" ry="9" fill="none" stroke="#ffffff" stroke-width="0.5"/>
          <path d="M35 26 Q50 20 65 26 L68 90 Q50 96 32 90 Z" fill="none" stroke="#ffffff" stroke-width="0.5"/>
          <line x1="0" y1="128" x2="100" y2="128" stroke="#ffffff" stroke-width="0.4" stroke-dasharray="2,2"/>
        </svg>
      </div>
      <div class="field-grid">
        <div class="field"><label>體重 (kg)</label><input type="number" id="bf-weight" step="0.1" placeholder="選填"></div>
        <div class="field"><label>體脂率 (%)</label><input type="number" id="bf-bodyfat" step="0.1" placeholder="選填"></div>
        <div class="field"><label>肌肉量 (kg)</label><input type="number" id="bf-muscle" step="0.1" placeholder="選填"></div>
      </div>
      <div class="note-field"><label>備註（聚餐／生理期／訓練日…）</label><input type="text" id="bf-note" placeholder="選填"></div>
      <button class="add-btn" onclick="addBodyEntry()">加入身形紀錄</button>
      <button class="cancel-btn" onclick="clearBodyPreview()">取消</button>
    </div>

    <div class="section-title">時間軸</div>
    <div id="bodyTimeline" class="body-timeline"></div>

    <div class="section-title">體重趨勢</div>
    <div class="chart-box" id="weightChart"></div>

    <div class="section-title">身形比較</div>
    <div class="compare-box">
      <div class="compare-selects">
        <select id="compareA"></select>
        <select id="compareB"></select>
      </div>
      <div class="compare-view" id="compareView"></div>
      <div class="diff-badge" id="compareDiff"></div>
    </div>
  </div>

  <!-- SETTINGS TAB -->
  <div class="tab-panel" id="tab-settings">
    <div class="section-title" style="margin-top:0;">每日目標設定</div>
    <div class="settings-card">
      <div class="settings-row"><label>熱量目標 (大卡)</label><input type="number" id="t-cal"></div>
      <div class="settings-row"><label>蛋白質目標 (g)</label><input type="number" id="t-protein"></div>
      <div class="settings-row"><label>碳水目標 (g)</label><input type="number" id="t-carbs"></div>
      <div class="settings-row"><label>脂肪目標 (g)</label><input type="number" id="t-fat"></div>
      <button class="save-btn" onclick="saveTargets()">儲存目標</button>
      <div class="saved-toast" id="targetToast"></div>
    </div>

    <div class="section-title">匯出資料</div>
    <div class="settings-card">
      <div style="font-size:12px;color:var(--muted);line-height:1.6;">匯出所有飲食紀錄與身形紀錄（含體重／體脂數字，不含照片檔案）為 Excel 檔。</div>
      <button class="export-btn" onclick="exportExcel()">匯出成 Excel</button>
    </div>
  </div>
</div>

<div class="summary-bar" id="summaryBar">
  <div class="summary-inner">
    <div class="sum-row">
      <div class="sum-item">
        <div class="sum-top"><span>攝取熱量</span><span class="sum-cur" id="sumCal">0 / 0</span></div>
        <div class="bar-track"><div class="bar-fill cal" id="barCal" style="width:0%"></div></div>
      </div>
    </div>

async function analyzeFood(base64, mediaType){
  document.getElementById('loadingBox').style.display='flex';
  try{
    const knownText = (document.getElementById('knownItemsInput').value||'').trim();
    const knownInstruction = knownText
      ? `使用者已提供部分品項與克數，這些是「已知、準確」的資訊，請直接依照這些名稱與克數計算營養值（source 設為 "known"），不要重新用照片猜測其重量：
${knownText}
照片中若還有使用者沒列出的其他食物，請你自行辨識並估算份量與營養值（source 設為 "estimated"）。若使用者列出的品項在照片中看不出來也沒關係，一樣依使用者提供的克數計算。`
      : `請辨識照片中的所有食物，估算份量與營養值（每個項目 source 都設為 "estimated"）。`;
    const prompt = `你是專業營養師。${knownInstruction}
僅回傳 JSON，不要有任何其他文字、說明或 markdown 符號。格式：
{"items":[{"name":"食物名稱","amount":"份量或克數描述","calories":整數,"protein":整數,"carbs":整數,"fat":整數,"source":"known"或"estimated"}],"note":"簡短說明，20字以內"}
單位：calories 為大卡，protein/carbs/fat 為公克。estimated 的部分僅供參考。`;
    const response = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body: JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1500,
        messages:[{role:"user",content:[
          {type:"image",source:{type:"base64",media_type:mediaType,data:base64}},
          {type:"text",text:prompt}
        ]}]})
    });
    const data = await response.json();
    if(!response.ok){
      throw new Error(data?.error?.message || `API 錯誤 (狀態碼 ${response.status})`);
    }
    if(!data.content || !data.content.length){
      throw new Error('API 沒有回傳內容');
    }
    const text = data.content.map(b=>b.text||'').join('');
    const jsonStart = text.indexOf('{');
    const jsonEnd = text.lastIndexOf('}');
    if(jsonStart===-1 || jsonEnd===-1){
      throw new Error('AI 回傳的內容不是預期的 JSON 格式：' + text.slice(0,120));
    }
    const jsonStr = text.slice(jsonStart, jsonEnd+1);
    let parsed;
    try{
      parsed = JSON.parse(jsonStr);
    }catch(parseErr){
      throw new Error('JSON 解析失敗：' + parseErr.message);
    }
    if(!parsed.items || !Array.isArray(parsed.items) || parsed.items.length===0){
      throw new Error('AI 沒有辨識出任何食物項目，請換一張更清楚的照片再試');
    }
    renderResultCard(parsed);
  }catch(err){
    console.error(err);
    document.getElementById('errorBox').textContent = '辨識失敗：' + (err.message || '請重新拍照或稍後再試。');
    document.getElementById('errorBox').style.display='block';
  }finally{
    document.getElementById('loadingBox').style.display='none';
  }
}

function renderResultCard(result){

        <span class="src-badge ${it.source==='known'?'known':'estimated'}">${it.source==='known'?'已知':'AI估算'}</span>
      </div>

      <div class="item-macros">
        <div class="im cal"><div class="im-label">大卡</div><input id="it-cal-${i}" type="number" value="${it.calories??0}"></div>
        <div class="im"><div class="im-label">蛋白質g</div><input id="it-protein-${i}" type="number" value="${it.protein??0}"></div>
        <div class="im"><div class="im-label">碳水g</div><input id="it-carbs-${i}" type="number" value="${it.carbs??0}"></div>
        <div class="im"><div class="im-label">脂肪g</div><input id="it-fat-${i}" type="number" value="${it.fat??0}"></div>
      </div>
    </div>`).join('');
  const total = items.reduce((a,it)=>({calories:a.calories+(it.calories||0),protein:a.protein+(it.protein||0),carbs:a.carbs+(it.carbs||0),fat:a.fat+(it.fat||0)}),{calories:0,protein:0,carbs:0,fat:0});
  document.getElementById('resultCard').innerHTML = `
    <div class="label-card">
      <div class="label-title">營養標示</div>
      <div class="tag-row">
        <select id="f-tag">
          <option value="">無標籤</option>
          <option value="聚餐">聚餐</option>
          <option value="生理期">生理期</option>
          <option value="訓練日">訓練日</option>
          <option value="外食">外食</option>
          <option value="居家">居家</option>
        </select>
      </div>
      ${itemsHtml}
      <div class="items-total"><span>合計</span><span>${total.calories} 大卡</span></div>
      ${result.note?`<div class="note">＊ ${escapeHtml(result.note)}</div>`:''}
      <div class="note">＊ 「已知」項目依你輸入的克數計算，「AI估算」為照片判斷，僅供參考，皆可手動修改。</div>
      <label class="fav-check"><input type="checkbox" id="f-savefav"> 加入常用食物清單（整份餐點）</label>
      <button class="add-btn" onclick="addToLog(${items.length})">加入今日紀錄</button>
      <button class="cancel-btn" onclick="clearResult()">取消</button>
    </div>`;
  window.__resultItems = items;

async function addToLog(count){
  const tag = document.getElementById('f-tag').value||'';
  const saveFav = document.getElementById('f-savefav').checked;
  const entries = [];
  for(let i=0;i<count;i++){
    entries.push({

      time: new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}),
      name: document.getElementById(`it-name-${i}`).value || '未命名品項',
      portion: document.getElementById(`it-amount-${i}`).value || '',
      tag,
      calories: Number(document.getElementById(`it-cal-${i}`).value)||0,
      protein: Number(document.getElementById(`it-protein-${i}`).value)||0,
      carbs: Number(document.getElementById(`it-carbs-${i}`).value)||0,
      fat: Number(document.getElementById(`it-fat-${i}`).value)||0,
    });
  }
  if(saveFav){
    const favs = await getFavorites();
    entries.forEach(e=>favs.push({id:e.id+'f',name:e.name,portion:e.portion,calories:e.calories,protein:e.protein,carbs:e.carbs,fat:e.fat}));
    await window.storage.set('favorites', JSON.stringify(favs), false);
    renderFavorites();
  }
  const existing = await getEntries();
  existing.push(...entries);
  await window.storage.set(DIET_KEY, JSON.stringify(existing), false);

  clearResult();
  renderDietLog();
}

async function addExercise(){

  let weight = Number(document.getElementById('ex-weight').value)||0;

  }
  if(!duration || !weight){
    alert('請輸入運動時間，並確認體重（可先到「身形」分頁記錄一次體重）');
    return;
  }
  const calories = Math.round(met * weight * (duration/60));
  const entries = await getExerciseEntries();
  entries.push({id:Date.now().toString(),time:new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}),name:sel.value,duration,weight,calories});
  await window.storage.set(EXERCISE_KEY, JSON.stringify(entries), false);

async function renderDietLog(){
  const entries = await getEntries();
  const listEl = document.getElementById('logList');
  listEl.innerHTML = entries.length===0 ? '<div class="empty">今天還沒有紀錄，拍張照片開始吧！</div>' :
    entries.map(e=>`

          <div class="li-name">${escapeHtml(e.name)}${e.tag?`<span class="li-tag">${escapeHtml(e.tag)}</span>`:''}</div>
          <div class="li-macros">${e.time}｜蛋白質 ${e.protein}g・碳水 ${e.carbs}g・脂肪 ${e.fat}g</div>
        </div>
        <div class="li-cal">${e.calories}</div>
        <button class="del-btn" onclick="deleteEntry('${e.id}')">✕</button>
      </div>`).join('');
  const burned = await renderExerciseList();
  const t = entries.reduce((a,e)=>({calories:a.calories+e.calories,protein:a.protein+e.protein,carbs:a.carbs+e.carbs,fat:a.fat+e.fat}),{calories:0,protein:0,carbs:0,fat:0});
  const net = Math.max(0, t.calories - burned);
  document.getElementById('sumCal').textContent = `${t.calories} / ${targets.calories}`;
  document.getElementById('sumBurned').textContent = `-${burned}`;
  document.getElementById('sumNet').textContent = `${net} / ${targets.calories}`;
  document.getElementById('sumProtein').textContent = `${t.protein}/${targets.protein}g`;
  document.getElementById('sumCarbs').textContent = `${t.carbs}/${targets.carbs}g`;
  document.getElementById('sumFat').textContent = `${t.fat}/${targets.fat}g`;
  document.getElementById('barCal').style.width = Math.min(100, targets.calories? net/targets.calories*100:0)+'%';
  document.getElementById('barProtein').style.width = Math.min(100, targets.protein? t.protein/targets.protein*100:0)+'%';
  document.getElementById('barCarbs').style.width = Math.min(100, targets.carbs? t.carbs/targets.carbs*100:0)+'%';
  document.getElementById('barFat').style.width = Math.min(100, targets.fat? t.fat/targets.fat*100:0)+'%';
}

function resizeImage(dataUrl, maxDim, quality, cb){
  const img = new Image();
  img.onload = ()=>{
    let w = img.width, h = img.height;
    if(w>h){ if(w>maxDim){h=h*maxDim/w; w=maxDim;} } else { if(h>maxDim){w=w*maxDim/h; h=maxDim;} }
    const canvas = document.createElement('canvas');
    canvas.width=w; canvas.height=h;
    canvas.getContext('2d').drawImage(img,0,0,w,h);
    cb(canvas.toDataURL('image/jpeg', quality));
  };
  img.src = dataUrl;
}

function buildLine(pts, key, w, h, pad, min, max){
  const range = (max-min)||1;
  const valid = pts.map((p,i)=>({i,v:p[key]})).filter(x=>x.v!=null);
  if(valid.length<2) return null;
  const stepX = (w-pad*2)/(pts.length-1 || 1);
  const coords = valid.map(x=>[pad + x.i*stepX, pad + (1-(x.v-min)/range)*(h-pad*2)]);
  const path = coords.map((c,i)=>(i===0?'M':'L')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');
  const dots = coords.map(c=>`<circle cx="${c[0]}" cy="${c[1]}" r="3" fill="currentColor"/>`).join('');
  return {path, dots, first:valid[0].v, last:valid[valid.length-1].v};
}

function renderWeightChart(pts){
  const box = document.getElementById('weightChart');
  const hasWeight = pts.filter(p=>p.weight!=null).length>=2;
  const hasMuscle = pts.filter(p=>p.muscleMass!=null).length>=2;
  if(!hasWeight && !hasMuscle){ box.innerHTML = '<div class="empty">至少需要 2 筆含體重或肌肉量的紀錄才能繪製趨勢圖</div>'; return; }
  const w=300,h=130,pad=26;
  const allVals = pts.flatMap(p=>[p.weight,p.muscleMass]).filter(v=>v!=null);
  const min=Math.min(...allVals), max=Math.max(...allVals);
  const weightLine = hasWeight ? buildLine(pts,'weight',w,h,pad,min,max) : null;
  const muscleLine = hasMuscle ? buildLine(pts,'muscleMass',w,h,pad,min,max) : null;
  const firstDate = pts[0].date.slice(5), lastDate = pts[pts.length-1].date.slice(5);
  box.innerHTML = `
    <div class="chart-legend">
      ${weightLine?'<span><i class="dotline" style="background:#e8590c"></i>體重</span>':''}
      ${muscleLine?'<span><i class="dotline" style="background:#2f6f4e"></i>肌肉量</span>':''}
    </div>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;">
      ${weightLine?`<g style="color:#e8590c"><path d="${weightLine.path}" fill="none" stroke="currentColor" stroke-width="2"/>${weightLine.dots}</g>`:''}
      ${muscleLine?`<g style="color:#2f6f4e"><path d="${muscleLine.path}" fill="none" stroke="currentColor" stroke-width="2"/>${muscleLine.dots}</g>`:''}
      <text x="${pad}" y="${h-6}" font-size="8" fill="#6b6b63">${firstDate}</text>
      <text x="${w-pad}" y="${h-6}" font-size="8" fill="#6b6b63" text-anchor="end">${lastDate}</text>
      <text x="${pad}" y="14" font-size="10" font-weight="700" fill="#1a1a1a">${max.toFixed(1)}</text>
      <text x="${pad}" y="${h-pad+10}" font-size="10" font-weight="700" fill="#1a1a1a">${min.toFixed(1)}</text>
    </svg>`;
}

async function renderCompare(){
  const entries = await getBodyEntries();
  const idA = document.getElementById('compareA').value;
  const idB = document.getElementById('compareB').value;
  const a = entries.find(e=>e.id===idA), b = entries.find(e=>e.id===idB);
  const view = document.getElementById('compareView');
  const diffEl = document.getElementById('compareDiff');
  if(!a || !b){ view.innerHTML=''; diffEl.textContent=''; return; }
  view.innerHTML = `
    <div class="compare-col"><img src="${a.photo}"><div class="cc-date">${a.date}</div><div class="cc-weight">${a.angle}${a.weight?' ・ '+a.weight+'kg':''}${a.muscleMass?' ・ 肌 '+a.muscleMass+'kg':''}</div></div>
    <div class="compare-col"><img src="${b.photo}"><div class="cc-date">${b.date}</div><div class="cc-weight">${b.angle}${b.weight?' ・ '+b.weight+'kg':''}${b.muscleMass?' ・ 肌 '+b.muscleMass+'kg':''}</div></div>`;
  const lines = [];
  if(a.weight!=null && b.weight!=null){
    const diff = b.weight - a.weight;
    lines.push(`<div class="diff-badge ${diff<=0?'down':'up'}">體重變化：${diff>0?'+':''}${diff.toFixed(1)} kg</div>`);
  }
  if(a.muscleMass!=null && b.muscleMass!=null){
    const mdiff = b.muscleMass - a.muscleMass;
    lines.push(`<div class="diff-badge ${mdiff>=0?'down':'up'}">肌肉量變化：${mdiff>0?'+':''}${mdiff.toFixed(1)} kg</div>`);
  }
  if(a.bodyFat!=null && b.bodyFat!=null){
    const fdiff = b.bodyFat - a.bodyFat;
    lines.push(`<div class="diff-badge ${fdiff<=0?'down':'up'}">體脂率變化：${fdiff>0?'+':''}${fdiff.toFixed(1)} %</div>`);
  }
  diffEl.innerHTML = lines.join('') || '';
}
document.getElementById('compareA').addEventListener('change', renderCompare);
document.getElementById('compareB').addEventListener('change', renderCompare);

/* ---------- export ---------- */
async function exportExcel(){
  const keys = await window.storage.list('entries:', false);
  const dietRows = [];
  if(keys && keys.keys){
    for(const k of keys.keys){
      const r = await window.storage.get(k, false);
      if(!r) continue;
      const date = k.replace('entries:','');
      JSON.parse(r.value).forEach(e=>{
        dietRows.push({日期:date,時間:e.time,品項:e.name,份量:e.portion||'',標籤:e.tag||'',熱量:e.calories,蛋白質:e.protein,碳水:e.carbs,脂肪:e.fat});
      });
    }
  }
  dietRows.sort((a,b)=> (a.日期+a.時間).localeCompare(b.日期+b.時間));

  const exKeys = await window.storage.list('exercise:', false);
  const exerciseRows = [];
  if(exKeys && exKeys.keys){
    for(const k of exKeys.keys){
      const r = await window.storage.get(k, false);
      if(!r) continue;
      const date = k.replace('exercise:','');
      JSON.parse(r.value).forEach(e=>{
        exerciseRows.push({日期:date,時間:e.time,運動類型:e.name,時間_分鐘:e.duration,體重:e.weight,消耗熱量:e.calories});
      });
    }
  }
  exerciseRows.sort((a,b)=> (a.日期+a.時間).localeCompare(b.日期+b.時間));

  const bodyEntries = await getBodyEntries();
  const bodyRows = bodyEntries.map(e=>({日期:e.date,角度:e.angle,體重:e.weight??'',體脂率:e.bodyFat??'',肌肉量:e.muscleMass??'',備註:e.note||''}));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dietRows.length?dietRows:[{提示:'尚無飲食紀錄'}]), '飲食紀錄');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(exerciseRows.length?exerciseRows:[{提示:'尚無運動紀錄'}]), '運動紀錄');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(bodyRows.length?bodyRows:[{提示:'尚無身形紀錄'}]), '身形紀錄');
  XLSX.writeFile(wb, `飲食身形紀錄_${todayKey()}.xlsx`);
}

/* ---------- init ---------- */
(async function init(){
  await loadTargets();
  await renderFavorites();
  await renderDietLog();
  await renderBodyTab();
})();
</script>
